name: Application CI/CD & Security Scan

on:
  push:
    branches:
      - master
    paths:
      - "example-voting-app"
      - ".github/workflows/app-deploy.yml"
  workflow_dispatch:

jobs:
  build-scan-push-deploy:
    runs-on: codebuild-eks-deploy-runner-${{ github.run_id }}-${{ github.run_attempt }}
    strategy:
      matrix:
        app: [vote, result, worker]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 1. AUTHENTICATE FIRST
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: example-${{ matrix.app }}-app
          IMAGE_TAG: latest
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG ./example-voting-app/${{ matrix.app }}
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ steps.login-ecr.outputs.registry }}/example-${{ matrix.app }}-app:latest"
          format: "table"
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

      - name: Deploy to EKS (Kustomize)
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          # 1. Update Kubeconfig
          aws eks update-kubeconfig --region ${{ secrets.AWS_REGION }} --name voting-app-cluster

          # 2. Enter the k8s directory where kustomization.yaml lives
          cd k8s

          # 3. Safely swap the target image with the new ECR URL
          kustomize edit set image example-${{ matrix.app }}-app=$ECR_REGISTRY/example-${{ matrix.app }}-app:latest

          # 4. Apply using Kustomize (-k) instead of file (-f)
          kubectl apply -k .

          # 5. Restart to pull the new image
          kubectl rollout restart deployment/${{ matrix.app }}
