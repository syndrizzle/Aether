name: Application CI/CD & Security Scan

on:
  push:
    branches:
      - master
    paths:
      - "example-voting-app"
      - ".github/workflows/app-deploy.yml"
  workflow_dispatch:

jobs:
  build-scan-push-deploy:
    runs-on: codebuild-eks-deploy-runner-${{ github.run_id }}-${{ github.run_attempt }}
    strategy:
      matrix:
        app: [vote, result, worker]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and export to Docker
        uses: docker/build-push-action@v5
        with:
          context: ./example-voting-app/${{ matrix.app }}
          load: true
          tags: ${{ secrets.DOCKER_USERNAME }}/example-${{ matrix.app }}-app:latest

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ secrets.DOCKER_USERNAME }}/example-${{ matrix.app }}-app:latest"
          format: "table"
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

      - name: Push to Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: ./example-voting-app/${{ matrix.app }}
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/example-${{ matrix.app }}-app:latest

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Update Kubeconfig
        run: aws eks update-kubeconfig --region ap-south-1 --name voting-app-cluster

      - name: Deploy to EKS
        run: |
          kubectl apply -f k8s/
          kubectl rollout restart deployment/${{ matrix.app }}
